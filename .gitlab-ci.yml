# GitLab CI/CD configuration for Band Gap's Stager project
# Runs tests, static analysis, and builds for the Flutter tree tracking application

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection

# Cache dependencies between pipeline runs to speed up builds
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .pub-cache/
    - .dart_tool/

# Define pipeline stages
stages:
  - setup
  - get-binaries
  - secret-detection
  - analyze
  - test
  - sonarcloud-check
  - build

# Global variables for consistent configuration
variables:
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  FLUTTER_ANALYTICS: "false"
  SECRET_DETECTION_ENABLED: 'true'
  # Defines the location of the analysis task cache
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  # Tells git to fetch all the branches of the project, required by the analysis task
  GIT_DEPTH: "0"

# Setup dependencies stage
setup_dependencies_linux:
  stage: setup
  image: ghcr.io/cirruslabs/flutter:latest
  tags:
    - bg-linux
  script:
    - flutter --version
    - flutter doctor -v
    - cmake -S . -B build
    - cmake --build build --target generate
  artifacts:
    paths:
      - pubspec.lock
      - "lib/**/*.g.dart"
      - .pub-cache/
      - .dart_tool/
    expire_in: 2 hours

setup_dependencies_windows:
  stage: setup
  tags:
    - bg-win
  script:
    - flutter --version
    - flutter doctor -v
    - cmake -S . -B build
    - cmake --build build --target generate
  artifacts:
    paths:
      - pubspec.lock
      - "lib/**/*.g.dart"
      - .pub-cache/
      - .dart_tool/
    expire_in: 2 hours

# Run all tests on all operating systems with coverage
test_all:
  stage: test
  tags:
    - bg-linux
  needs: ["test_linux", "test_macos", "test_windows"]
  script:
    - echo "Aggregating multi-platform test results."

test_linux:
  stage: test
  image: ghcr.io/cirruslabs/flutter:latest
  tags:
    - bg-linux
  needs: ["setup_dependencies_linux"]
  before_script:
    # Install lcov for genhtml command and lcov_cobertura for format conversion
    - apt-get update -qq && apt-get install -y -qq lcov python3-pip
    - pip install --break-system-packages lcov_cobertura
  script:
    - cmake --build --target test
    # Generate HTML coverage report
    - genhtml coverage/lcov.info -o $CI_PROJECT_DIR/coverage/html
    # Convert lcov.info to Cobertura format for GitLab
    - python3 -m lcov_cobertura coverage/lcov.info -o $CI_PROJECT_DIR/coverage/cobertura-coverage.xml
  # Regex to parse the coverage percentage from genhtml output
  coverage: '/lines\.*: \d+\.\d+%/'
  artifacts:
    name: "Coverage Report - $CI_COMMIT_REF_NAME"
    paths:
      # The path to the generated coverage reports, relative to the project root.
      - coverage/
    reports:
      # Define the coverage report for GitLab's built-in visualization.
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

test_macos:
  stage: test
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  dependencies: [] # Skip downloading Linux artifacts
  script:
    - echo "Running natively on GitLab's SaaS Apple Silicon!"
    - sw_vers

test_windows:
  stage: test
  tags:
    - bg-win
  dependencies: ["setup_dependencies_windows"] # Skip downloading Linux artifacts
  script:
    - cmake --build build --target test

# Static analysis and code quality. Only performed on Linux.
analyze:
  stage: analyze
  image: ghcr.io/cirruslabs/flutter:latest
  tags:
    - bg-linux
  needs: ["setup_dependencies_linux"]
  script:
    - echo "Running static analysis..."
    - cmake --build build --target analyze

# Dry run of dart publish. Only performed on Linux.
dart-publish-dry-run:
  stage: build
  tags:
    - bg-linux
  needs: ["test_all", "analyze"]
  script:
    - echo "Running 'dart pub publish --dry-run'."
    - dart pub publish --dry-run

# SonarQube binaries
get-binaries:
  stage: get-binaries
  image: ghcr.io/cirruslabs/flutter:latest
  tags:
    - bg-linux
  script:
    - curl -sSLo ./sonar-scanner.zip 'https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip'
    - unzip -o sonar-scanner.zip
    - mv sonar-scanner-8.0.1.6346-linux-x64 sonar-scanner
  artifacts:
    paths:
      - sonar-scanner/
    expire_in: 1 hour

# Actual SonarQube check
sonarcloud-check:
  stage: sonarcloud-check
  image: ghcr.io/cirruslabs/flutter:latest
  tags:
    - bg-linux
  dependencies:
    - get-binaries
    - test_linux
  script:
    - sonar-scanner/bin/sonar-scanner
