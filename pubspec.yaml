name: stager_platform
description: "A Flutter library for precisely managing and staging data in cross-platform applications."
version: 0.0.3
homepage: https://gitlab.com/bandgap/stager

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # Stager's Native Plugins
  stager_platform_native_plugins_platform_interface: ^0.0.1
  stager_platform_native_plugins_linux: ^0.0.1
  stager_platform_native_plugins: ^0.0.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  file_picker: ^10.3.2
  logger: ^2.6.1
  uuid: ^4.5.1
  xml: ^6.5.0
  http: ^1.6.0
  collection: ^1.19.1

  # Location and mapping
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geolocator_linux: ^0.2.3

  mockito: ^5.5.0
  plugin_platform_interface: ^2.1.8
  json_annotation: ^4.9.0
  flutter_file_dialog: ^3.0.2
  source_gen: ^4.2.2
  build: ^4.0.5
  analyzer: ^10.0.1
  glob: ^2.1.3
  code_builder: ^4.11.1
  dart_style: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  source_gen_test: ^1.3.5

  file_selector_platform_interface: ^2.6.2
  build_test: ^3.5.12
  build_runner: ^2.4.11
  json_serializable: ^6.13.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
  logging: any
  test: any
flutter:

  # Grab the assets directory to include all the files Stager needs.
  assets:
    - assets/schemas/kml/2.2.0/

  uses-material-design: true
  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
